<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compression Report | Faith Prior</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { background: var(--black); color: #fff; font-family: 'Courier New', monospace; padding: 20px; line-height: 1.6; }
        .lattice { max-width: 600px; margin: auto; border: 1px solid var(--gold); padding: 30px; }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 3px; font-size: 1.2rem; }
        .meta { font-size: 0.7rem; color: #666; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        label { display: block; color: var(--gold); font-size: 0.8rem; margin-top: 15px; }
        input, textarea, select { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px; margin-top: 5px; box-sizing: border-box; font-family: 'Courier New', monospace; }
        .btn { margin-top: 25px; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn:hover { background: rgba(212, 175, 55, 0.1); }
        .back { display: block; margin-top: 30px; color: #666; text-decoration: none; font-size: 0.7rem; text-align: center; }
    </style>
</head>
<body>
    <div class="lattice">
        <h1>Compression Report</h1>
        <div class="meta">AEP SUBMISSION PROTOCOL | REDUCE ENTROPY</div>
        
        <p style="font-size: 0.8rem; color: #888;">Submit high-entropy events or complex systems for algorithmic reduction.</p>

        <form action="mailto:scottdevine01@gmail.com" method="post" enctype="text/plain">
            <label>SOURCE NAME (OR ANONYMOUS)</label>
            <input type="text" name="name" placeholder="Signal Origin">

            <label>ENTROPY TYPE</label>
            <select name="type">
                <option value="moral">Moral (Conflict/Vice)</option>
                <option value="physical">Physical (Anomalous Order)</option>
                <option value="theoretical">Theoretical (Complex Paradox)</option>
                <option value="quickening">The Quickening (Evidence of Order)</option>
            </select>

            <label>DATA FOR REDUCTION</label>
            <textarea name="data" rows="6" placeholder="Describe the high-entropy system..."></textarea>

            <button type="submit" class="btn">Initiate Compression</button>
        </form>

        <a href="index.html" class="back">[ RETURN TO BASELINE ]</a>
    </div>
</body>
</html>
